<header class="sticky top-0 z-50 bg-white shadow-md border-b border-gray-200">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo/Brand -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors">
          Expenses Tracker
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="hidden md:flex md:space-x-8">
        <a
          routerLink="/dashboard"
          routerLinkActive="text-indigo-600 font-semibold"
          [routerLinkActiveOptions]="{ exact: false }"
          class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors"
        >
          Dashboard
        </a>
      </div>

      <!-- User Menu -->
      <div class="flex items-center space-x-4">
        @if (currentUser) {
          <div class="flex items-center space-x-3">
            <div class="hidden sm:block text-right">
              <p class="text-sm font-medium text-gray-900">{{ currentUser.name }}</p>
              <p class="text-xs text-gray-500">{{ currentUser.email }}</p>
            </div>
            <div class="relative group">
              <button
                type="button"
                class="flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                id="user-menu-button"
                aria-expanded="false"
                aria-haspopup="true"
              >
                <div class="h-8 w-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-semibold">
                  {{ currentUser.name.charAt(0).toUpperCase() }}
                </div>
                <svg
                  class="h-4 w-4 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </button>
              <!-- Dropdown Menu -->
              <div
                class="absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200"
                role="menu"
                aria-orientation="vertical"
                aria-labelledby="user-menu-button"
              >
                <div class="py-1">
                  <button
                    (click)="logout()"
                    class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                    role="menuitem"
                  >
                    Sign out
                  </button>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </nav>
</header>
