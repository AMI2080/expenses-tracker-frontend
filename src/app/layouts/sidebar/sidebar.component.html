<aside
  class="fixed left-0 top-0 h-screen bg-white border-r border-gray-200 transition-all duration-300 ease-in-out z-40 shadow-lg md:shadow-none"
  [class]="isCollapsed ? 'w-16 -translate-x-full md:translate-x-0' : 'w-64'"
>
  <nav class="h-full flex flex-col">
    <div class="border-b border-gray-200">
      @if (!isCollapsed) {
      <div class="flex items-center p-4">
        <button
          mat-button
          type="button"
          (click)="onToggleSidebar()"
          class="p-2 rounded-md text-gray-600 min-w-fit! mr-3"
          aria-label="Toggle sidebar"
        >
          <app-hamburger-icon />
        </button>
        <a
          [routerLink]="['dashboard']"
          class="text-xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors whitespace-nowrap"
        >
          Expenses Tracker
        </a>
      </div>
      } @if (isCollapsed) {
      <div class="flex flex-col items-center py-4">
        <button
          mat-button
          type="button"
          (click)="onToggleSidebar()"
          class="p-2 rounded-md text-gray-600 min-w-fit!"
          aria-label="Toggle sidebar"
        >
          <app-hamburger-icon />
        </button>
      </div>
      }
    </div>

    <div class="flex-1 overflow-y-auto py-4">
      <div class="space-y-1 px-3">
        @for (item of navigationItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-50 text-indigo-600"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center justify-start rounded-lg px-2.5 py-2 text-sm font-medium transition-colors hover:bg-gray-100 text-gray-700"
          [title]="isCollapsed ? item.label : ''"
        >
          <ng-container *ngComponentOutlet="item.icon" />
          <span *ngIf="!isCollapsed" class="ml-3">{{ item.label }}</span>
        </a>
        }
      </div>
    </div>

    <div class="border-t border-gray-200">
      @if (currentUser) {
      <div class="p-4 border-b border-gray-200">
        <div class="flex items-center space-x-3">
          <div
            class="h-7.5 w-7.5 rounded-full bg-indigo-600 flex items-center justify-center text-white font-semibold flex-shrink-0"
            [title]="
              isCollapsed ? `${currentUser.name} - ${currentUser.email}` : ''
            "
          >
            {{ currentUser.name.charAt(0).toUpperCase() }}
          </div>
          <div *ngIf="!isCollapsed" class="grow min-w-0">
            <p
              class="text-sm font-medium text-gray-900 truncate"
              [title]="currentUser.name"
            >
              {{ currentUser.name }}
            </p>
            <p
              class="text-xs text-gray-500 truncate"
              [title]="currentUser.email"
            >
              {{ currentUser.email }}
            </p>
          </div>
        </div>
      </div>
      }
      <button
        mat-button
        type="button"
        (click)="logout()"
        color="warn"
        class="[&_.mdc-button\_\_label]:w-full rounded-lg px-2.5 py-2 m-4 text-sm font-medium transition-colors cursor-pointer w-[calc(100%-2rem)] min-w-fit! grow"
        [ngClass]="{
          'justify-center': isCollapsed,
          'justify-start': !isCollapsed
        }"
        [title]="isCollapsed ? 'Sign out' : ''"
      >
        <div class="flex items-center justify-start">
          <app-sign-out-icon></app-sign-out-icon>
          <span *ngIf="!isCollapsed" class="ms-3">Sign out</span>
        </div>
      </button>
    </div>
  </nav>
</aside>
